<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edE7d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161419" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PROOF — an evidence-led research engine. Every answer, set in print and sourced."
    />

    <!-- Favicon: riso duotone dot mark -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23edE7d6'/%3E%3Ccircle cx='13' cy='16' r='8' fill='%232438d6'/%3E%3Ccircle cx='19' cy='16' r='8' fill='%23ff4d1c' style='mix-blend-mode:multiply'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <title>PROOF — evidence-led research</title>

    <!-- Set theme before paint to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("proof-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
