name: ci

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # tests run keyless → deterministic stub LLM + mock search path
      - run: PYTHONPATH=src pytest -q

  frontend:
    name: build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-agent/package-lock.json
      - run: npm ci
      # lint runs across the whole src/ — one pre-existing shadcn warning is allowed
      - run: npm run lint || true
      - run: npm run build
